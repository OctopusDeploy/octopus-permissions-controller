# This rule is not used by the project octopus-permissions-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete workloadserviceaccounts.
# 
# By design, this role grants permissions to grant permissions which may be used 
# to escalate their privileges. Treat it with the same care as the admin role.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: octopus-permissions-controller
    app.kubernetes.io/managed-by: kustomize
  name: workloadserviceaccount-editor-role
rules:
- apiGroups:
  - agent.octopus.com
  resources:
  - workloadserviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agent.octopus.com
  resources:
  - workloadserviceaccounts/status
  verbs:
  - get
