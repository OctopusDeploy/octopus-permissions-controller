# This rule is not used by the project octopus-permissions-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to get, list, and watch clusterworkloadserviceaccounts.
#
# This role cannot create or change these resources, so it cannot be used to grant permissions.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: octopus-permissions-controller
    app.kubernetes.io/managed-by: kustomize
  name: clusterworkloadserviceaccount-viewer-role
rules:
- apiGroups:
  - agent.octopus.com
  resources:
  - clusterworkloadserviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agent.octopus.com
  resources:
  - clusterworkloadserviceaccounts/status
  verbs:
  - get
