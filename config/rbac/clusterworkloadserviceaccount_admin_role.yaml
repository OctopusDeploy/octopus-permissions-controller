# This rule is not used by the project octopus-permissions-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over clusterworkloadserviceaccounts.
#
# By design, this role grants permissions to grant permissions which may be used
# to escalate privileges. Only bind it to users trusted to grant any permission in the cluster.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: octopus-permissions-controller
    app.kubernetes.io/managed-by: kustomize
  name: clusterworkloadserviceaccount-admin-role
rules:
- apiGroups:
  - agent.octopus.com
  resources:
  - clusterworkloadserviceaccounts
  verbs:
  - '*'
- apiGroups:
  - agent.octopus.com
  resources:
  - clusterworkloadserviceaccounts/status
  verbs:
  - get
