name: Release Please
on:
  push:
    branches:
      - main

# release-please authenticates with GHA_TOKEN (so actions run against its PR); the default
# GITHUB_TOKEN needs nothing beyond read
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: '${{ secrets.GHA_TOKEN }}'
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
